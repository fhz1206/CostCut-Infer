# CostCut-Infer 默认配置（toml 格式）
# 注意：所有键 casefold 后匹配；section 名也 casefold。CLI > toml > env > 默认。

[engine]
max_num_seqs = 8
max_num_batched_tokens = 8192
chunked_prefill_size = 4096
num_scheduler_threads = 1
num_worker_threads = 4
scheduler_delay_factor = 0.0
log_level = "INFO"
mem_budget_gb = 2.5

[kv_cache]
kv_l1_bytes = 1073741824  # 1GB
kv_l2_dir = "./.kv_cache"
kv_l2_max_bytes = 68719476736  # 64GB
kv_policy = "hybrid"  # hybrid / disk_first / memory_first
kv_block_size = 16
kv_evict_high_water = 0.8
kv_evict_low_water = 0.6
kv_hot_window_steps = 16
kv_l2_compression = "none"  # none / lz4
kv_cache_ttl_seconds = 0

[experts]
expert_residency = "zero"  # zero（零驻留）/ page_cache_only
expert_ring_slots = 2
expert_index_cache = "./.kv_cache/expert_index.json"
expert_verify_crc = false

[weights]
weight_streaming = "auto"  # auto / on / off
weight_ring_layers = 2
weight_stream_chunk = "auto"  # auto / layer / sublayer
weight_stream_bandwidth_log = true

[quant]
quantization = "auto"  # auto / fp8_per_token / int8_per_channel_weight_only / mxfp8 / nvfp4_per_token / int8_per_token / bf16
quant_ignore = []  # 列表，正则字符串
fp8_compute_mode = "w8a16"  # w8a16（默认精确反量化）/ w8a8（CPU 对照基准）
kv_cache_dtype = "auto"  # auto（按 checkpoint kv_cache_scheme）/ bf16 / fp8

[resources]
resource_pct = 50  # 全局 CPU/内存/IO 比例（%）
resource_cpu_pct = "auto"  # auto=resource_pct；显式覆盖可填整数或 "50%"
resource_mem_pct = "auto"
resource_io_pct = "auto"
resource_monitor_interval = 1.0  # 秒
resource_throttle = "auto"  # auto（超限自限）/ warn / off

[pipeline]
pipeline_depth = 3
prefetch_layers_ahead = 2
prefetch_mode = "auto"  # auto / avx2 / off
expert_readahead_mb = 128
speculative_route_history = 4
pipeline_metrics = true

[spec_decode]
enable_mtp = true
mtp_draft_tokens = 1
enable_ngram = false
ngram_window = 8

[api]
host = "0.0.0.0"
port = 8000
api_key = null  # null / 字符串
sse_heartbeat_seconds = 15.0
cors = true
