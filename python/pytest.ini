[pytest]
# CostCut-Infer 测试配置
# 默认跳过真模型慢测试（标 @pytest.mark.slow）—— 完整套件需 Ornith 41GB 在场
# 全量跑：pytest python/tests -m ""  （取消 -m "not slow" 过滤）
testpaths = python/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    -q
    --tb=short
    -p no:cacheprovider
markers =
    slow: tests that need real Ornith checkpoint (skip in CI by default)
    network: tests requiring network access
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
