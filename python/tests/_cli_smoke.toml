# CLI 冒烟测试配置（短生成，控制时长；测试专用，非默认配置）
[default]
model = "Qwen3.6-35B-A3B-AWQ-4bit"

[model]
name = "Qwen3.6-35B-A3B-AWQ-4bit"
path = "models/Qwen3.6-35B-A3B-AWQ-4bit"
expert_cache_max = 128

[inference]
temperature = 0.0          # 贪心（可复现）
top_p = 0.9
max_new_tokens = 2         # 限制生成长度，控制冒烟时长

[chat]
max_history = 20
auto_save_history = false
