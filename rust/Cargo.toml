[package]
name = "costcut-infer"
version = "0.1.0"
edition = "2021"
description = "CostCut Infer（Rust 版，性能优先——纯 std 推理运行时）"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11.0"
