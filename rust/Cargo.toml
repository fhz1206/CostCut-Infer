[package]
name = "costcut-infer"
version = "0.1.0"
edition = "2021"
description = "CostCut Infer（Rust 版，性能优先——纯 std 推理运行时）"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11.0"
memmap2 = "0.9.11"
rayon = "1.12.0"
regex = "1.13.1"
serde_json = "1.0.151"
# tch 依赖 libtorch 2.11.0（LIBTORCH env——项目根 libtorch/）+ MSVC 工具链（版本匹配）
tch = "0.24.0"
thiserror = "2.0.20"
tokenizers = "0.23.1"
