# ============================================================
# liteengine 配置文件（纯 Python 推理引擎）
# ------------------------------------------------------------
# 三个区块，从上往下看即可：
#   [default]    默认模型：填下方某个 [model] 块的 name
#   [model]      模型列表：每个模型一个 [model] 块（只支持这种写法）
#   [inference]  生成参数（温度 / 采样 / 系统提示词）
#   [chat]       对话历史设置
#
# 注意：liteengine 仅支持 Qwen3_5Moe 文本架构；其它架构的模型
# 可以注册显示，但 /model 切换时会提示不支持。
# ============================================================

[default]
model = "Qwen3.6-35B-A3B-AWQ-4bit"    # 默认对话模型：须与某个 [model] 块的 name 一致

# ------------------------------------------------------------
# 模型列表（每个模型一个 [model] 块，字段均可省略）
#   name              模型短名（必填，须唯一，/model 切换用）
#   path              模型目录（省略时默认 models/<name>）
#   expert_cache_max  专家反量化缓存上限（条目，每条约 12MB，默认 128 ≈ 1.5GB）
# ------------------------------------------------------------

[model]
name = "Qwen3.6-35B-A3B-AWQ-4bit"     # 短名：主对话模型
path = "models/Qwen3.6-35B-A3B-AWQ-4bit"
expert_cache_max = 128                # 专家缓存上限（跨层共享，与层数无关）
dspark_model = "Qwen3.6-35B-A3B-speculator.dspark"                     # 投机解码草稿模型目录；留空 = 禁用投机（标准自回归）

[model]
name = "Qwen3-ASR-1.7B"               # 短名（liteengine 不支持 ASR 架构，仅注册显示）
path = "models/Qwen3-ASR-1.7B"

[model]
name = "Router"                       # 短名（自定义路由模型，暂不支持）
path = "models/Router"

# ------------------------------------------------------------
# 生成参数
# ------------------------------------------------------------
[inference]
temperature = 0.9          # 采样温度：越高越发散（<=0 为贪心，可复现）
top_p = 0.9                # nucleus 采样：仅从累计概率 top_p 的 token 中采样（0~1）
top_k = 0                  # 采样时只保留前 top_k 个候选（0 表示关闭）
repetition_penalty = 1   # 重复惩罚：>1 抑制重复，=1 不干预
max_new_tokens = 2048      # 单次回复的最大新 token 数（通常由 <|im_end|> 提前结束）
system_prompt = "你是一个乐于助人的助手"   # 系统提示词（对话开头注入）

# 精度 / 优化开关（本机实测部分优化反而变慢——默认关闭，他机 / 其它精度模型可开启尝试）
compute_dtype = "float32"      # 计算精度：fp32（本机 CPU 实测最优）/ fp16 / bf16（可选）
expert_parallel = false        # 专家多线程并行（本机实测慢 ~5 倍——默认关，他机可试）
int4_fused_matmul = false      # int4 融合 matmul（本机实测慢——默认关，他机可试）
speculate = false              # 投机解码（本机实测慢——默认关；/speculate 可运行时切换）

# ------------------------------------------------------------
# 对话历史
# ------------------------------------------------------------
[chat]
max_history = 20           # 参与上下文的最大历史轮数
auto_save_history = false  # 是否自动保存历史到 history_file
history_file = ".chat_history.json"   # 历史记录文件路径
