name: ci
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
jobs:
  test:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 30
    env:
      CCUT_PYTHON: C:\\Users\\ASUS\\AppData\\Local\\Programs\\Python\\Python314\\python.exe
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        run: |
          $env:PATH = "C:\Users\ASUS\AppData\Local\Programs\Python\Python314;" + $env:PATH
          python --version
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          python -m pip install numpy psutil safetensors numba torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          python -m compileall -q python\ccut python\CostCut-Infer.py
      - name: Pytest (synthetic small models)
        run: |
          cd $env:GITHUB_WORKSPACE
          $env:PYTHONPATH = "python"
          python -m pytest python\tests -q -m "not slow" --tb=short --cov=python\ccut --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
